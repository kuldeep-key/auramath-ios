name: auramath
description: "Auramath: bar-model maths for children."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  auramath_engine:
    path: packages/auramath_engine
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  fake_async: ^1.3.3
  json_schema: ^5.2.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sample_pack/
    - assets/spec/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
