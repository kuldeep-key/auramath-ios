error_types:                     # tutor_response describes the help; the lines shown, with their weight versions, are in tutor/policy.yaml
  - id: difference_as_amount
    description: Puts the difference on the unknown as its amount (107 on the fig tree), or answers 186 + 107
    skill: cmp.read-difference
    counts_as: wrong
    side_lesson: on_repeat
    tutor_response: "Hint H1·5: is the {b} {D} {unit} tall, or {D} {unit} {b_word} than the {a}?"
    sources: [SR-4, CALL-0921]
  - id: relation_reversed
    description: Sizes the second bar the wrong way round (longer when it should be shorter, or the reverse); on the answer sheet, the unknown given as A + D (293 for 186/107 taller, Julia's 479)
    skill: cmp.read-relation
    counts_as: wrong
    side_lesson: on_repeat
    side_lesson_content: "Show me how (Building A and B). If time permits at M2+ (TUT-17, D-28): Julia's 'a longer bar represents a greater number' (3 and 5), then 3 stars and 5 stars"
    tutor_response: "Hint: taller or shorter? (H1·4)"
    sources: [SR-4, VIF-S8-1009, VIF-S9-1009]
  - id: keyword_strategy
    description: Subtracts on the 'shorter' version ('shorter means minus')
    skill: cmp.inconsistent-wording
    counts_as: wrong
    side_lesson: on_repeat
    tutor_response: "Hint: longer bar or shorter bar? (D4w)"
    sources: [SR-4]
  - id: operation_reversed
    description: Picks adding when the story needs taking away on the taller version (Figma journey 15, "Picked plus instead of take away")
    skill: cmp.choose-operation
    counts_as: wrong
    side_lesson: on_repeat
    tutor_response: "Hint D4w: longer bar or shorter bar?"
    sources: [FLOW-12-15, SR-4]
  - id: sub_smaller_from_larger
    description: Takes the smaller digit from the larger in a column (186 - 107 = 81)
    skill: arith.sub-3d-regroup
    counts_as: wrong
    side_lesson: immediate
    tutor_response: "Side lesson: take away across a ten (T1)"
    sources: [SR-4, ASK-J15]
  - id: carry_dropped
    description: Drops one or more carries in addition (186 + 79 = 255, or 155 if both carries are dropped)
    skill: arith.add-3d-regroup
    counts_as: wrong
    side_lesson: immediate
    tutor_response: Side lesson on adding across a ten
    sources: [SR-4]
  - id: answered_wrong_question
    description: Correct model, gives the unknown (79) instead of the total
    skill: prob.read-question
    counts_as: wrong
    side_lesson: on_repeat
    tutor_response: "Ask what the question wants"
    sources: [SR-4]
  - id: reference_changed
    description: Starts from one quantity, then treats the other as the reference part-way through
    skill: cmp.hold-reference
    counts_as: wrong
    side_lesson: on_repeat
    detection_note: No detector yet; needs a rule on the drawing steps once the bar interactions are built (Kuldeep with Apoorv).
    sources: [SR-4]
  - id: transposition
    description: Digits swapped in an entered answer (97 for 79), fixed on 'check again'
    skill: null
    counts_as: no_cost
    side_lesson: none
    tutor_response: "Check your sum again (J17)"
    sources: [SR-4, ASK-J17]
