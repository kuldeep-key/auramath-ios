    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [ns.count-back-10]
    number_range: {min: 1, max: 20}
    sources: [NUM-1007]
  - id: ns.count-back-30
    name: Count backward in sequence from 30
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [ns.count-back-20]
    number_range: {min: 1, max: 30}
    activities: ["Which group of ten a number belongs to (12, 13, 19 in 10-19; 25, 28 in 20-29)"]
