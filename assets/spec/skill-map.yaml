  # ------------------------------------------------ number sense, NSW Early Stage 1 (Julia, 7 Oct)
  - id: ns.subitise-5
    name: Instantly name the number of objects by sight, up to 5
    kind: number-sense
    status: foundation-next
    curriculum:
      - {framework: NSW-K10-2022, stage: "Early Stage 1", code: null, note: "Representing whole numbers; code to map"}
    prerequisites: [ns.count-to-5, ns.last-number-is-total]
    number_range: {min: 1, max: 5}
    activities:                 # Julia, 9 Oct: two activities are enough, dots on a cube and drag-and-drop counting
      - "Drag items left to right and count as you drop"
      - "Dots on a dice, fingers on hands, timed"
      - "How many balls? Tap one of four numbers (Julia lists this under ns.last-number-is-total; kept here until the Numbers topic is designed)"
    practice_first: true        # NUM-1009: repeated practice first, tests from time to time
    observed_errors: ["miscounting", "over-counting or under-counting", "incorrect answers"]
    speed_signal: "Speed differences could show which skill was used: subitising versus finger counting."
    sources: [NUM-1007, NUM-1009]
  - id: ns.count-to-5
    name: Count up to 5 items with one-to-one correspondence
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    sources: [NUM-1007]
  - id: ns.last-number-is-total
    name: The last number counted is the total; write the numeral
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    activities:
      - "Type the number in, or tap a number from four"
      - "Count five cubes aloud (one, two, three, four, five), then choose or drag the numeral 5"   # NUM-1009
    sources: [NUM-1007, NUM-1009]
  - id: vocab.after-forward
    name: The words "after" and "forward"
    kind: vocabulary
    status: foundation-next
    note: '"After" is the next number; "forward" is several numbers on. Julia, 9 Oct: teach "after" as its own short drag-and-drop activity, before counting forward.'
    sources: [NUM-1007, NUM-1009]
  - id: vocab.before-backward
    name: The words "before" and "backward"
    kind: vocabulary
    status: foundation-next
    sources: [NUM-1007]
  - id: ns.count-fwd-10
    name: Count forward in sequence up to 10
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [vocab.after-forward]
    number_range: {min: 1, max: 10}
    activities: ["Complete the sequence from a given number (5, _, _, _)", "Drag and drop or type the numbers in"]
    remediation:
      - "Show the digit and ask the child to draw or drag items"
      - "Show a number line"
      - "Break it down to one digit"
      - "If the child is one step below (needing help or taking a long time), practise fingers and numbers"
    observed_errors: ["Unable to identify the number 8 without running through a sequence"]
    sources: [NUM-1007]
  - id: ns.count-fwd-20
    name: Count forward in sequence up to 20
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [ns.count-fwd-10]
    number_range: {min: 1, max: 20}
    activities: ["As up to 10 with larger numbers; trickier items cross from one digit to two (8... 11)"]
    sources: [NUM-1007]
  - id: ns.count-fwd-30
    name: Count forward in sequence up to 30
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [ns.count-fwd-20]
    number_range: {min: 1, max: 30}
    sources: [NUM-1007]
  - id: ns.count-back-10
    name: Count backward in sequence from 10
    kind: number-sense
    status: foundation-next
    curriculum: [{framework: NSW-K10-2022, stage: "Early Stage 1", code: null}]
    prerequisites: [vocab.before-backward]
    number_range: {min: 1, max: 10}
    activities: ["Random drag-and-drop numbers", "Missing digits", "Fill the blanks on a number line, adding more gaps"]
