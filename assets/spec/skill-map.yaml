version: 0.3.0
updated: 2026-10-09
notes: >
  Provisional. Lemon tree skills come from Julia's 28 Sep email as set out in the scoring
  report (section 4), with prerequisite curriculum references from that report. The
  number-sense skills come from Julia's 7 Oct "NSW curriculum - Numbers" document; she gave
  no syllabus codes, so code is null until mapped. How the Numbers skills are used this term
  was decided on 8 Oct (D-09): prerequisites, the starting check and stepping down; the full
  Numbers topic is next term. The method is the Singapore model method; NSW Mathematics K-10
  (2022) sets the progression, with Singapore primary levels alongside (PLAT-08, D-27).
  Julia's 9 Oct review notes (NUM-1009) for the Numbers skills: younger children (4 to 7) practise first
  and are tested only from time to time (applied to the starting check for ages 6 and 7, D-29); time how
  long a skill takes to learn (can be worked out from the event log; not a requirement this term); activity text is written for the child, and the teacher's
  notes on errors stay in their own field (observed_errors); errors seen in an activity can be taken up in
  another session (for the Numbers topic, next term).
age_defaults: {}   # superseded 8 Oct by the placement table in content/arithmetic.yaml (ACC-05, SKL-07)
skills:
  # ------------------------------------------------ question type 2: total and difference (CON-07; the burger and drink is one example)
  - id: td.total-and-difference
    name: Find two amounts from their total and their difference
    kind: problem
    status: provisional
    curriculum:
      - {framework: NSW-K10-2022, stage: "Stage 2", code: MA2-AR-01, note: "to confirm with Dr Fong"}
      - {framework: SG-MOE-Primary, stage: P3, note: "sum and difference model; level to confirm"}
    prerequisites: [cmp.read-difference, cmp.name-quantities, arith.addsub-2d-regroup]
    sources: [DP, DISC-0725, CALL-0921, PM-1008]
  # ------------------------------------------------ question type 1: comparison (the lemon tree problem is one example)
