# App-level settings that are not teaching rules. Provisional values; change without a release (PLAT-03).
version: 0.4.0
updated: 2026-11-02
session:
  cap_minutes: 30               # SES-01, D-07. Julia: "no more than half an hour"
  clock_pauses_while_offline: true      # SES-04 (v4): the 30-minute cap does not run while the lesson is paused for connection
  offline_pause_ends_session_after_minutes: 10   # SES-04 (v4): board saved; resumes at the same step next time
  daily_limit_minutes: null     # PAR-05 (v4): set by the parent; none by default. A session's cap is the smaller of cap_minutes and the time left today
  sitting_gap_minutes: 30       # DRAFT (product decision pending: "what a session is"). The app opens a backend session per
                                # problem; lessons less than this apart are one sitting, and the parent note (PAR-01) goes once
                                # per sitting, this long after its last session ends. 0: a note per session, as before
streak:                         # REW-05 (v4)
  missed_days_covered: 1        # missed days in a row covered automatically; after a longer gap the moment just doesn't show
rewards:                        # D-47 OPEN (Julia, key-product): the recommended default, "on as the PRD describes", built
  status: draft                 # behind flags session_badges, trail, streak_moment, mastery_badges (off; on in dev). Every
  names_for_julia: true         # child-facing name below is KEY'S DRAFT for Julia to validate (CON-09); change them here
  session_badge:                # REW-01: one per session, never zero, naming something the child did (TUT-12's plain words)
    solved: "{problem_name}"    # a problem solved: the story's problem_name, e.g. "Tree Word Problem"
    worked_on: "{problem_name} Explorer"   # worked on a problem, none solved
    opened: "Case Opener"       # came to the lesson, nothing on the board yet
  trail:                        # REW-04: one stop per level of each question type, in skill-map order; DRAFT names for Julia
    cmp.comparison:
      L1: "Sprout Meadow"
      L2: "Orchard Path"
      L3: "Big Tree Bridge"
      L4: "Lemon Grove"
      L5: "Shorter Puzzle Peak"
    td.total-and-difference:    # shown only while flags.total_and_difference is on (CON-07)
      L1: "Market Stall"
      L2: "Toy Shop"
      L3: "Big Bazaar"
  level_badges:                 # REW-06: the badge for passing a level's move-up gate; DRAFT names for Julia, plain words
    cmp.comparison:
      L1: "Taller and shorter, up to 20"
      L2: "Taller and shorter, up to 100"
      L3: "Two steps, up to 1000"
      L4: "Two steps with regrouping, up to 1000"
      L5: "The tricky 'shorter' word"
    td.total-and-difference:
      L1: "Total and difference, up to 20"
      L2: "Total and difference, up to 100"
      L3: "Total and difference, up to 1000"
setup:                          # ACC-04, D-36 (v4): Julia's 6 to 10, not narrowed; a content value
  ages: [6, 7, 8, 9, 10]
  school_years: [kindergarten, year_1, year_2, year_3, year_4, year_5]   # NSW; a 10-year-old may be in Year 5
  goals: [build_confidence, catch_up, get_ahead, word_problems, school_curriculum, not_sure]
  already_does: [counting_to_100, adding_to_100, taking_away_to_100, adding_to_1000, taking_away_to_1000, word_problems_with_bars, not_sure]
ai:                             # D-34 (v4). Provisional values; Vishal confirms (D-50)
  decision_target_ms: 2000      # NFR-05: 90% of evaluator decisions within this
  fallback_after_ms: 4000       # NFR-05, AI-04: the rules' default applies at this point
  waiting_cue_after_ms: 1000    # the case partner shows a small thinking cue; never a blocking spinner
  kill_switch_fallback_rate: 0.2   # AI-04: the evaluator switches itself off if more than this share of decisions fall back
  kill_switch_window_minutes: 15
  kill_switch_min_decisions: 50     # AI-04: the switch only trips with at least this many decisions in the window
  kill_switch_reset: manual_after_review   # Vishal or Kuldeep turns the evaluator back on after reviewing the flagged decisions
  generation_retries: 1         # CON-08: regenerate once, then the code generator's problem
devices:
  join_code_ttl_minutes: 10     # DEV-02, legacy PAC-06
  join_code_charset: digits      # Figma journey 3: "Six digits"
  join_code_length: 6
  join_code_max_attempts: 5     # Figma journey 32: "5 tries"
report:
  send_within_minutes: 5        # PAR-01, provisional
  default_frequency: each_session   # D-16
flags:                          # PLAT-06. Remote flags; defaults shown
  three_in_a_row: false         # REW-02, D-10
  child_questions: false        # TUT-13, D-01 closed: tap-to-ask buttons only (M3)
  quick_sums: false             # LES-16, D-22 (M3)
  total_and_difference: false   # CON-07, D-20 (target M3)
  read_aloud: true              # NFR-06, D-13 revised (v4): every child screen from R1
  read_question_aloud: true     # NFR-08, D-13: tap-to-hear the question from R1
  read_aloud_default_on_ages: [6, 7]   # NFR-06, D-13
  model_rewording: false        # TUT-11, TUT-14 (v4): live phrasing within approved patterns; off until Julia validates the patterns
  ai_evaluator: false           # AI-01, D-34 (v4): on only after the golden set passes (AI-05); rules' defaults while off
  ai_decisions: false           # AI-04, TUT-01 (M3): the app acts on the server's decision instead of only logging it; the rules' default stays its fallback at 4 s
  ai_generation: false          # CON-08, D-34 (v4): live problems; the code generator (CON-01) while off
  case_partner_intro: true      # AI-07 (v4)
  self_rating: false            # AI-08, D-47 (v4); never offered at age 6
  self_rating_min_age: 7
  read_again_prompt: false      # AI-09 (v4)
  seen_before_bridge: false     # AI-10 (v4)
  trail: false                  # REW-04, D-47 (v4)
  streak_moment: false          # REW-05, D-47 (v4)
  mastery_badges: false         # REW-06, D-47 (v4)
  session_badges: false         # REW-01, D-47 (v4): the server's one badge per session (rewards.session_badge)
  weekly_summary: false         # PAR-11, D-39 (v4)
  recent_notes_in_app: false    # PAR-12, D-39 (v4)
  report_delivery: false        # REW-01, PAR-01: Y4 'Sent to your grown-up' shows only when on (M3)
  real_families: false          # PRV-05: only with recorded legal review sign-off
  bar_sense_side_lessons: false   # TUT-17 (tentative, D-28)
  weight_stories: false         # CON-11 (M3): the selector skips stories whose quantity is mass while off
flags_by_env:                   # PLAT-06: an environment's own defaults over the flags above (APP_ENV). Staging and prod run the flags as written
  dev:                          # recommended defaults while the decisions are open; Product changes them here or with a remote flag
    ai_decisions: true          # AI-04: the app acts on the server's decision (dev only)
    self_rating: true           # AI-08, D-47 open: draft default, dev only; never under self_rating_min_age
    read_again_prompt: true     # AI-09: the read-again prompt after two fast wrong answers
    seen_before_bridge: true    # AI-10, D-47 open: draft default, dev only
    session_badges: true        # REW-01, D-47 open: draft default, dev only
    trail: true                 # REW-04, D-47 open: draft default, dev only
    streak_moment: true         # REW-05, D-47 open: draft default, dev only
    mastery_badges: true        # REW-06, D-47 open: draft default, dev only
